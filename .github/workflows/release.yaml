name: Publish Core Library

# Standard tag-driven publish (shared pattern across the WeatherConditions libs):
#   push a tag vX.Y.Z  ->  publishes com.abyxcz.weatherconditions.core:core-lib:X.Y.Z
#   or run manually via workflow_dispatch with an explicit version.
# Version flows in through -PlibVersion; build.gradle.kts falls back to its default when unset.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.1.0). Blank = build.gradle default.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to GitHub Packages
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=""
          fi
          ARGS=""
          [[ -n "$VERSION" ]] && ARGS="-PlibVersion=$VERSION"
          echo "Publishing version: ${VERSION:-<build.gradle default>}"
          # Compile-gate: build + jar every publication locally FIRST. GitHub Packages
          # versions are immutable, so a compile failure partway through a direct publish
          # leaves some target artifacts uploaded and permanently 409s the version.
          # core-lib publishes 11 targets, so the exposure here is large.
          ./gradlew publishToMavenLocal $ARGS
          ./gradlew publishAllPublicationsToGitHubPackagesRepository $ARGS
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
